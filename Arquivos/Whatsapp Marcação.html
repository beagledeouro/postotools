<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESF CDI 2 — Lembrete de Consulta</title>
    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="stylesheet" href="../assets/css/whatsapp-marcacao.css">
    <script src="../assets/js/whatsapp-marcacao.js" defer></script>
</head>
<body>

<header class="app-header">
    <div class="app-header-inner">
        <h1>ESF CDI 2 — Lembrete de Consulta</h1>
        <a class="home-link" href="../index.html">← Início</a>
    </div>
</header>

<div class="container">
    <h2>Gerar Lembrete de Consulta</h2>
    
    <div class="form-grid">
        <div class="form-group full-width">
            <label for="paciente">Nome do Paciente:</label>
            <input type="text" id="paciente" placeholder="Ex: Maria da Silva" autocomplete="off">
        </div>

        <div class="form-group">
            <label for="data">Dia da Consulta:</label>
            <input type="date" id="data">
        </div>

        <div class="form-group">
            <label for="horario">Horário:</label>
            <input type="time" id="horario">
        </div>

        <div class="form-group full-width">
            <label for="especialidade">Especialidade / Médico:</label>
            <input type="text" id="especialidade" placeholder="Ex: Cardiologia - Dr. João" autocomplete="off">
        </div>
    </div>

    <div class="preview-container">
        <label class="preview-label">Pré-visualização do Cartão:</label>
        <canvas id="cartaoCanvas" width="600" height="350"></canvas>
    </div>

    <button id="downloadBtn">Baixar Lembrete (PNG)</button>
</div>

</body>
</html>
