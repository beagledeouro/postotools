<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Atestados e Declarações - ESF CDI 2</title>
    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="stylesheet" href="../assets/css/atestados.css">
    <script src="../assets/js/vendor/html2canvas.min.js"></script>
    <script src="../assets/js/vendor/jspdf.umd.min.js"></script>
    <script src="../assets/js/exportar-pdf.js"></script>
    <script src="../assets/js/atestados.js" defer></script>
</head>
<body>
    <header class="app-header">
        <div class="app-header-inner">
            <h1>ESF CDI 2 — Atestados e Declarações</h1>
            <a class="home-link" href="../index.html">← Início</a>
        </div>
    </header>

    <main class="no-print">
        <h2>Emissor de Atestados e Declarações</h2>
        <form id="docForm">
            <div class="row">
                <div class="col form-group">
                    <label for="tipoDoc">Tipo de Documento:</label>
                    <select id="tipoDoc">
                        <option value="atestado">Atestado Médico (Afastamento)</option>
                        <option value="declaracao">Declaração de Comparecimento (Paciente)</option>
                        <option value="acompanhante">Declaração de Acompanhante</option>
                    </select>
                </div>
                <div class="col form-group">
                    <label for="unidade">Unidade de Saúde:</label>
                    <input type="text" id="unidade" value="ESF CDI 2" required>
                </div>
            </div>

            <!-- DADOS DO PACIENTE -->
            <div class="row">
                <div class="col form-group">
                    <label for="nome" id="lblNomePaciente">Nome do Paciente:</label>
                    <input type="text" id="nome" placeholder="Nome completo" required>
                </div>
                <div class="col form-group">
                    <label for="nascimento">Data de Nascimento:</label>
                    <input type="date" id="nascimento">
                </div>
            </div>
            <div class="row" id="divCpf">
                <div class="col form-group">
                    <label for="cpf">CPF do Paciente:</label>
                    <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" required>
                </div>
                <div class="col form-group">
                    <label for="dataDoc">Data do Atendimento / Emissão:</label>
                    <input type="date" id="dataDoc" required>
                </div>
            </div>

            <!-- SEÇÃO ESPECÍFICA: ATESTADO MÉDICO -->
            <section id="secaoAtestado" class="conditional-section">
                <h3>Configurações do Atestado Médico</h3>
                <div class="row">
                    <div class="col form-group">
                        <label for="qtdDias">Quantidade de Dias de Afastamento:</label>
                        <input type="number" id="qtdDias" min="1" max="120" value="1">
                    </div>
                    <div class="col form-group">
                        <label for="inicioAfastamento">A partir de:</label>
                        <input type="date" id="inicioAfastamento">
                    </div>
                    <div class="col form-group">
                        <label>Retorno Previsto em:</label>
                        <input type="text" id="previsaoRetorno" readonly style="background:#e2e8f0; font-weight:600;">
                    </div>
                </div>
                <div class="row">
                    <div class="col form-group">
                        <label for="medicoNome">Nome do Profissional:</label>
                        <input type="text" id="medicoNome" placeholder="Dr(a). Nome do Médico">
                    </div>
                    <div class="col form-group">
                        <label for="medicoCrm">Conselho / CRM:</label>
                        <input type="text" id="medicoCrm" placeholder="CRM-MG 00000">
                    </div>
                </div>
                <div class="checkbox-group">
                    <input type="checkbox" id="exibirCid">
                    <label for="exibirCid">Incluir CID-10 no atestado (mediante expressa autorização do paciente)</label>
                </div>
                <div id="divCidCampos" class="cid-fields">
                    <div class="row">
                        <div class="col form-group">
                            <label for="codigoCid">Código CID:</label>
                            <input type="text" id="codigoCid" placeholder="Ex: J00, A09, M54.5">
                        </div>
                        <div class="col form-group cid-consent">
                            <div class="checkbox-group">
                                <input type="checkbox" id="autorizaCid" checked>
                                <label for="autorizaCid">Paciente autorizou expressamente a menção do CID</label>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- SEÇÃO ESPECÍFICA: DECLARAÇÃO DE COMPARECIMENTO -->
            <section id="secaoDeclaracao" class="conditional-section">
                <h3>Configurações da Declaração de Comparecimento</h3>
                <div class="row">
                    <div class="col form-group">
                        <label for="horaInicio">Horário de Entrada:</label>
                        <input type="time" id="horaInicio" value="08:00">
                    </div>
                    <div class="col form-group">
                        <label for="horaFim">Horário de Saída:</label>
                        <input type="time" id="horaFim" value="11:30">
                    </div>
                </div>
            </section>

            <!-- SEÇÃO ESPECÍFICA: DECLARAÇÃO DE ACOMPANHANTE -->
            <section id="secaoAcompanhante" class="conditional-section">
                <h3>Dados do(a) Acompanhante</h3>
                <div class="row">
                    <div class="col form-group">
                        <label for="acompNome">Nome do(a) Acompanhante:</label>
                        <input type="text" id="acompNome" placeholder="Nome completo do acompanhante">
                    </div>
                    <div class="col form-group">
                        <label for="acompCpf">CPF do(a) Acompanhante:</label>
                        <input type="text" id="acompCpf" placeholder="000.000.000-00" maxlength="14">
                    </div>
                </div>
                <div class="row">
                    <div class="col form-group">
                        <label for="acompParentesco">Grau de Parentesco / Relação:</label>
                        <input type="text" id="acompParentesco" placeholder="Ex: Mãe, Pai, Filho(a), Cônjuge, Cuidador(a)">
                    </div>
                    <div class="col form-group">
                        <label for="acompInicio">Horário de Entrada:</label>
                        <input type="time" id="acompInicio" value="08:00">
                    </div>
                    <div class="col form-group">
                        <label for="acompFim">Horário de Saída:</label>
                        <input type="time" id="acompFim" value="11:30">
                    </div>
                </div>
            </section>

            <div class="btn-container">
                <button type="submit">Imprimir Documento (2 Vias lado a lado)</button>
                <button type="button" class="secondary" data-action="limpar">Limpar Formulário</button>
            </div>
        </form>
    </main>
    
    <!-- ÁREA DE IMPRESSÃO (2 VIAS A4) -->
    <div id="printArea" class="print-container"></div>
</body>
</html>
