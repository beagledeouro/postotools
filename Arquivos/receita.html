<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emissor de Receitas - ESF CDI 2</title>
    <link rel="stylesheet" href="../assets/css/common.css">
    <link rel="stylesheet" href="../assets/css/receita.css">
</head>
<body>

    <!-- HEADER DA APLICAÇÃO -->
    <header class="app-header">
        <div class="app-header-inner">
            <h1>ESF CDI 2 — Receituário</h1>
            <a class="home-link" href="../index.html">← Início</a>
        </div>
    </header>

    <!-- INTERFACE DA APLICAÇÃO (TELA) -->
    <div class="app-container">
        
        <!-- COLUNA ESQUERDA: CONFIGURAÇÕES E PACIENTE -->
        <div class="left-col">
            <!-- Tipo de Receita -->
            <div class="card">
                <h2>Tipo de Documento</h2>
                <div class="form-group">
                    <label for="tipo-receita">Tipo de Receituário</label>
                    <select id="tipo-receita">
                        <option value="simples">Receituário Comum (2 Vias)</option>
                        <option value="especial">Receituário de Controle Especial (Portaria 344/98)</option>
                    </select>
                </div>
            </div>

            <!-- Dados do Profissional / Unidade -->
            <div class="card">
                <h2>Configurações do Profissional</h2>
                <div class="form-group">
                    <label for="cfg-unidade">Unidade de Saúde</label>
                    <input type="text" id="cfg-unidade" value="ESF CDI 2" readonly>
                </div>
                <div class="form-group">
                    <label for="cfg-medico">Nome do Profissional</label>
                    <input type="text" id="cfg-medico" placeholder="Ex: Dr. Leonardo Silva ou Enf. Joana Santos">
                </div>
                <div class="row">
                    <div class="form-group">
                        <label for="cfg-esp">Especialidade / Cargo</label>
                        <input type="text" id="cfg-esp" placeholder="Ex: Médico de Família ou Enfermeiro(a)">
                    </div>
                    <div class="form-group">
                        <label for="cfg-crm">Conselho / Registro / UF</label>
                        <input type="text" id="cfg-crm" placeholder="Ex: CRM-MG 123456 ou COREN-MG 654321">
                    </div>
                </div>
                <button class="save-config" data-action="salvar-configuracoes">💾 Salvar Dados Locais</button>
            </div>

            <!-- Dados do Paciente -->
            <div class="card">
                <h2>Dados do Paciente</h2>
                <div class="form-group">
                    <label for="pac-nome">Nome Completo</label>
                    <input type="text" id="pac-nome" placeholder="Nome do paciente" required>
                </div>
                <div class="row">
                    <div class="form-group">
                        <label for="pac-idade">Idade / Data Nasc.</label>
                        <input type="text" id="pac-idade" placeholder="Ex: 35 anos ou 10/05/1988">
                    </div>
                </div>
                <div class="form-group">
                    <label for="pac-end">Endereço (obrigatório p/ Controle Especial)</label>
                    <input type="text" id="pac-end" placeholder="Rua, Número, Bairro, Cidade">
                </div>
            </div>
        </div>

        <!-- COLUNA DIREITA: PRESCRIÇÃO E MODELOS -->
        <div class="right-col">
            
            <!-- Gestão de Modelos -->
            <div class="card model-card">
                <h2>Modelos / Protocolos de Prescrição</h2>
                <div class="row model-row">
                    <select id="select-template">
                        <option value="">-- Selecione um modelo salvo --</option>
                    </select>
                    <button data-action="carregar-modelo">Carregar</button>
                    <button class="danger" data-action="excluir-modelo">Excluir</button>
                </div>
            </div>

            <!-- Adição de Medicamentos -->
            <div class="card">
                <h2>Adicionar Medicamento</h2>
                
                <div class="form-group autocomplete-wrapper">
                    <label for="med-busca">Buscar Medicamento (REMUME / Atenção Básica)</label>
                    <input type="text" id="med-busca" placeholder="Digite para buscar (ex: Amoxicilina, Dipirona, Losartana)..." autocomplete="off">
                    <ul class="autocomplete-list" id="autocomplete-list"></ul>
                </div>

                <div class="form-group">
                    <label for="med-posologia">Posologia / Instruções de Uso</label>
                    <input type="text" id="med-posologia" placeholder="Ex: Tomar 1 comprimido de 8 em 8 horas por 5 dias.">
                </div>

                <div style="display: flex; gap: 10px; align-items: center; flex-wrap: wrap;">
                    <button data-action="adicionar-medicamento">➕ Adicionar à Receita</button>
                    <button type="button" class="custom-med-btn" id="btn-salvar-novo-med" title="Salvar o medicamento digitado na sua base pessoal">💾 Salvar na Lista Pessoal</button>
                </div>
            </div>

            <!-- Lista da Receita Atual -->
            <div class="card">
                <h2>Itens da Receita Atual</h2>
                <ul class="med-list" id="lista-receita">
                    <!-- Itens inseridos via JS -->
                </ul>
                <p id="empty-msg" class="empty-msg">Nenhum medicamento adicionado ainda.</p>

                <div class="action-bar">
                    <div class="action-model">
                        <input type="text" id="nome-modelo" placeholder="Nome do novo modelo">
                        <button data-action="salvar-modelo">💾 Salvar como Modelo</button>
                    </div>
                    <button class="print-btn" data-action="imprimir">🖨️ Imprimir / PDF (2 Vias)</button>
                </div>
            </div>
        </div>
    </div>

    <!-- ÁREA EXCLUSIVA DE IMPRESSÃO (ESCONDIDA NA TELA) -->
    <div class="print-area" id="print-area">
        <!-- O conteúdo das vias será injetado pelo JavaScript -->
    </div>

    <!-- SCRIPTS DE FUNCIONAMENTO -->
    <script src="../assets/js/vendor/html2canvas.min.js"></script>
    <script src="../assets/js/vendor/jspdf.umd.min.js"></script>
    <script src="../assets/js/exportar-pdf.js"></script>
    <script src="../assets/js/receita.js" defer></script>
</body>
</html>
