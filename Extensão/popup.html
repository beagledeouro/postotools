<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    body {
      width: 350px;
      margin: 0;
      padding: 16px;
      color: #20343a;
      background: #f3f7f8;
      font: 14px Arial, sans-serif;
    }
    h1 { margin: 0 0 4px; color: #086b76; font-size: 17px; }
    .hint { margin: 0 0 14px; color: #53676d; font-size: 12px; line-height: 1.4; }
    .actions { display: grid; gap: 7px; }
    button {
      width: 100%;
      min-height: 40px;
      padding: 9px 12px;
      color: #fff;
      background: #087e8b;
      border: 0;
      border-radius: 5px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }
    button:hover:not(:disabled) { background: #06636d; }
    button:disabled { cursor: wait; opacity: .65; }

    .section-box {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid #cbd9dc;
    }
    .section-box h2 { margin: 0 0 8px; font-size: 13px; color: #086b76; }
    
    .tools-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .tool-btn {
      background: #fff;
      color: #086b76;
      border: 1px solid #aebfc4;
      font-size: 12px;
      font-weight: 600;
      min-height: 36px;
      padding: 6px 8px;
    }
    .tool-btn:hover:not(:disabled) { background: #e6f4f4; color: #06636d; }

    .time-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
    label { display: grid; gap: 4px; color: #354b51; font-size: 11px; font-weight: 700; }
    input { width: 100%; min-height: 32px; padding: 5px 8px; border: 1px solid #aebfc4; border-radius: 4px; background: white; font: inherit; font-size: 12px; }
    #status { min-height: 28px; margin-top: 10px; color: #354b51; font-size: 12px; line-height: 1.35; }
  </style>
</head>
<body>
  <h1>Documentos do G-MUS</h1>
  <p class="hint">Abra a ficha do paciente no G-MUS e escolha uma ação.</p>
  
  <div class="actions">
    <button type="button" data-action="capa">📄 Gerar Capa de Prontuário (PDF)</button>
    <button type="button" data-action="gestante">🤰 Gerar Capa Gestante (PDF)</button>
  </div>

  <section class="section-box">
    <h2>Integração com Ferramentas do Posto</h2>
    <div class="tools-grid">
      <button type="button" class="tool-btn" data-tool="receita">💊 Receituário</button>
      <button type="button" class="tool-btn" data-tool="encaminhamento">📤 Encaminhamento</button>
      <button type="button" class="tool-btn" data-tool="whatsapp">💬 Lembrete Whats</button>
      <button type="button" class="tool-btn" data-tool="puericultura">👶 Puericultura</button>
    </div>
  </section>

  <section class="section-box" aria-labelledby="declarationTitle">
    <h2 id="declarationTitle">Declaração de comparecimento</h2>
    <label for="dataComparecimento">Data do comparecimento
      <input id="dataComparecimento" type="date" required>
    </label>
    <div class="time-row">
      <label for="horaInicio">Horário inicial
        <input id="horaInicio" type="time">
      </label>
      <label for="horaFim">Horário final
        <input id="horaFim" type="time">
      </label>
    </div>
    <button type="button" data-action="declaracao" style="margin-top: 10px">Criar declaração preenchida</button>
  </section>

  <div id="status" role="status" aria-live="polite"></div>

  <script src="pdf-lib.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
