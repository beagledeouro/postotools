<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * { box-sizing: border-box; }
    body {
      width: 330px;
      margin: 0;
      padding: 18px;
      color: #20343a;
      background: #f3f7f8;
      font: 14px Arial, sans-serif;
    }
    h1 { margin: 0 0 5px; color: #086b76; font-size: 18px; }
    .hint { margin: 0 0 16px; color: #53676d; line-height: 1.4; }
    .actions { display: grid; gap: 8px; }
    button {
      width: 100%;
      min-height: 42px;
      padding: 10px 12px;
      color: #fff;
      background: #087e8b;
      border: 0;
      border-radius: 5px;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
    }
    button:hover:not(:disabled) { background: #06636d; }
    button:disabled { cursor: wait; opacity: .65; }
    .declaration-settings {
      margin-top: 15px;
      padding-top: 13px;
      border-top: 1px solid #cbd9dc;
    }
    .declaration-settings h2 { margin: 0 0 10px; font-size: 14px; }
    .time-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    label { display: grid; gap: 5px; color: #354b51; font-size: 12px; font-weight: 700; }
    input { width: 100%; min-height: 36px; padding: 6px 8px; border: 1px solid #aebfc4; border-radius: 4px; background: white; font: inherit; }
    #status { min-height: 32px; margin-top: 12px; color: #354b51; font-size: 12px; line-height: 1.4; }
  </style>
</head>
<body>
  <h1>Documentos do G-MUS</h1>
  <p class="hint">Abra a ficha do paciente e escolha o documento para gerar.</p>
  <div class="actions">
    <button type="button" data-action="capa">Criar capa de prontuário</button>
    <button type="button" data-action="gestante">Criar capa gestante</button>
  </div>
  <section class="declaration-settings" aria-labelledby="declarationTitle">
    <h2 id="declarationTitle">Declaração de comparecimento</h2>
    <label for="dataComparecimento">Data do comparecimento
      <input id="dataComparecimento" type="date" required>
    </label>
    <div class="time-row">
      <label for="horaInicio">Horário inicial
        <input id="horaInicio" type="time">
      </label>
      <label for="horaFim">Horário final
        <input id="horaFim" type="time">
      </label>
    </div>
    <button type="button" data-action="declaracao" style="margin-top: 12px">Criar declaração preenchida</button>
  </section>
  <div id="status" role="status" aria-live="polite"></div>

  <script src="pdf-lib.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
